[package]
name = "sc2dsu"
version = "0.2.0"
edition = "2024"
description = "Cemuhook DSU server for 2015 and 2026 Steam Controller motion and inputs."
license = "MIT"
repository = "https://github.com/NightHammer1000/sc2dsu"
readme = "README.md"
keywords = ["steam-controller", "dsu", "cemuhook", "gyro", "hidapi"]
categories = ["hardware-support", "games"]

[dependencies]
hidapi = "2.6"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
eframe = "0.31"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
embed-manifest = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
